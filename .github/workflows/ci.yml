name: Nudge AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Test Suite (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest Test Suite
        env:
          GROQ_API_KEY: "gsk_dummy_test_key_for_ci_pipeline"
          MONGODB_URI: "mongodb+srv://dummy:dummy@cluster0.mongodb.net/test"
          MONGODB_DB_NAME: "meeting_agent_test"
        run: |
          pytest backend/tests -v

  frontend-build:
    name: Frontend Build & Typecheck (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build
