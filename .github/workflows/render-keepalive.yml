name: Render Backend Keepalive

on:
  schedule:
    # Run every 10 minutes (Render spins down after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Render Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          echo "Pinging Nudge backend on Render to prevent cold start sleep..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://nudge-backend-8fri.onrender.com/api/health)
          echo "Received HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Backend is warm and healthy!"
          else
            echo "⚠️ Backend returned status $HTTP_STATUS (may still be waking up)"
          fi
